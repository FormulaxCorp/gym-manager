name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" "https://zstgiptwnqzsvgntsgtz.supabase.co/rest/v1/app_data?select=id&limit=1")
          echo "Supabase ping: HTTP $HTTP_CODE at $(date -u)"
          if [ "$HTTP_CODE" -ne 200 ]; then exit 1; fi
